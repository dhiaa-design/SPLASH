<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradien Air Biru SPLASH -->
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>
    <!-- Gradien Timbangan Emas/Kuning -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0B3D91" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Percikan Air (Water Splash Backdrop) -->
  <path d="M 60 10 
           C 75 35, 105 45, 105 75 
           C 105 100, 85 112, 60 112 
           C 35 112, 15 100, 15 75 
           C 15 45, 45 35, 60 10 Z" 
        fill="url(#splashGrad)" filter="url(#shadow)"/>

  <!-- Tetesan Percikan Kecil di Sekitar -->
  <circle cx="100" cy="30" r="5" fill="#4FACFE" opacity="0.8"/>
  <circle cx="20" cy="35" r="4" fill="#00C9FF" opacity="0.8"/>
  <circle cx="95" cy="85" r="3.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="25" cy="85" r="3" fill="#FFFFFF" opacity="0.9"/>

  <!-- Timbangan Terintegrasi di Dalam Tetesan Air -->
  <!-- Tiang Penopang -->
  <path d="M 58 50 L 62 50 L 64 88 L 56 88 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Alas Timbangan -->
  <ellipse cx="60" cy="90" rx="18" ry="4.5" fill="#FFFFFF"/>
  <!-- Titik Tumpu Segitiga -->
  <polygon points="60,46 54,56 66,56" fill="url(#goldGrad)"/>

  <!-- Lengan Timbangan (Seimbang Sempurna) -->
  <rect x="30" y="49" width="60" height="4.5" rx="2.2" fill="url(#goldGrad)"/>
  <circle cx="60" cy="51" r="3.5" fill="#FFFFFF"/>

  <!-- Cawan Kiri & Tali -->
  <line x1="36" y1="52" x2="30" y2="68" stroke="#FFFFFF" stroke-width="1.8"/>
  <line x1="36" y1="52" x2="42" y2="68" stroke="#FFFFFF" stroke-width="1.8"/>
  <path d="M 28 68 Q 36 78 44 68 Z" fill="url(#goldGrad)"/>
  <!-- Balok di Cawan Kiri (x & y) -->
  <rect x="31" y="62" width="5.5" height="5.5" rx="1" fill="#FF7A00"/>
  <rect x="38" y="62" width="5.5" height="5.5" rx="1" fill="#AB47BC"/>

  <!-- Cawan Kanan & Tali -->
  <line x1="84" y1="52" x2="78" y2="68" stroke="#FFFFFF" stroke-width="1.8"/>
  <line x1="84" y1="52" x2="90" y2="68" stroke="#FFFFFF" stroke-width="1.8"/>
  <path d="M 76 68 Q 84 78 92 68 Z" fill="url(#goldGrad)"/>
  <!-- Balok Angka di Cawan Kanan -->
  <rect x="80" y="62" width="8" height="5.5" rx="1" fill="#29B6F6"/>

  <!-- Kilauan Cahaya Air -->
  <path d="M 40 28 C 30 45, 30 70, 32 80" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.45" fill="none"/>
</svg>
