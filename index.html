<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPLASH – Sistem Persamaan Linear Asyik dan Seru</title>
  <meta name="description" content="Media Pembelajaran Interaktif Matematika Materi SPLDV untuk Siswa Kelas VIII SMP.">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <!-- Stylesheets Terstruktur -->
  <link rel="stylesheet" href="css/variables.css?v=2.3">
  <link rel="stylesheet" href="css/base.css?v=2.3">
  <link rel="stylesheet" href="css/layout.css?v=2.3">
  <link rel="stylesheet" href="css/components.css?v=2.3">
  <link rel="stylesheet" href="css/balance.css?v=2.3">
  <link rel="stylesheet" href="css/print.css?v=2.3">
</head>
<body>

  <!-- Header Utama Aplikasi -->
  <header class="app-header">
    <div class="header-left">
      <!-- Tombol Hamburger Mobile -->
      <button class="hamburger-btn" id="btn-hamburger" aria-label="Buka Menu Navigasi">
        ☰
      </button>

      <!-- Logo & Judul SPLASH -->
      <a href="#/beranda" class="brand-link">
        <img src="assets/images/logo.svg" alt="Logo SPLASH" class="brand-logo-svg">
        <div class="brand-text-wrap">
          <span class="brand-title">SPLASH</span>
          <span class="brand-tagline">Sistem Persamaan Linear Asyik dan Seru</span>
        </div>
      </a>
    </div>

    <!-- Sisi Kanan Header: Profil Pengguna, Bantuan, Keluar -->
    <div class="header-right">
      <div id="header-user-profile" class="flex items-center gap-2 hidden">
        <span id="header-user-role" class="badge badge-role-siswa">🎒 Siswa</span>
        <span id="header-user-name" style="font-weight: 700; font-size: 0.95rem; color: var(--color-white); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          Siswa
        </span>
      </div>

      <!-- Tombol Bantuan Per Halaman -->
      <button class="btn btn-sm btn-secondary hidden" id="btn-header-help" title="Petunjuk & Bantuan Halaman Ini" aria-label="Petunjuk Halaman Ini">
        💡 Petunjuk
      </button>

      <!-- Tombol Keluar -->
      <button class="btn btn-sm btn-outline hidden" id="btn-header-logout" style="color: white; border-color: rgba(255,255,255,0.4);" title="Keluar dari Akun">
        🚪 Keluar
      </button>
    </div>
  </header>

  <!-- Shell Aplikasi: Sidebar + Konten Utama -->
  <div class="app-wrapper">
    
    <!-- Backdrop Mobile -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar Navigasi -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Navigasi Utama">
      <div class="sidebar-content">
        
        <!-- Progress Bar Belajar Siswa di Sidebar -->
        <div class="student-progress-card" id="sidebar-progress-card">
          <div class="progress-card-title">
            <span>Progres Belajar</span>
            <span id="sidebar-progress-text">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="sidebar-progress-fill"></div>
          </div>
          <div class="progress-subtext" id="sidebar-progress-subtext">
            0 dari 8 Tahap Selesai
          </div>
        </div>

        <!-- Menu Navigasi -->
        <ul class="nav-menu" id="sidebar-menu-list">
          <!-- Item menu akan di-render dinamis oleh app.js sesuai role -->
        </ul>

      </div>
    </aside>

    <!-- Konten Halaman Aktif -->
    <main class="main-wrapper">
      <div class="content-container" id="main-content" role="main">
        <!-- Tampilan halaman spesifik akan dimuat di sini oleh Router -->
      </div>

      <!-- Footer -->
      <footer class="app-footer">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem;">
          <div>
            <strong>SPLASH</strong> – Sistem Persamaan Linear Asyik dan Seru &copy; 2026. Media Pembelajaran Matematika SMP Kelas VIII.
          </div>
          <div style="font-size: 0.8rem; color: var(--color-text-light);">
            Berbasis Kurikulum Merdeka (Fase D)
          </div>
        </div>
      </footer>
    </main>

  </div>

  <!-- Wadah Toast Notifikasi -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Entry Script Modular (ES Modules) -->
  <script type="module" src="js/app.js?v=2.3"></script>
</body>
</html>
